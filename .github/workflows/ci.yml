name: CI

# GitHub-hosted runners only. The live tests (GORYNYCH_LIVE=1) need logged-in agents and stay skipped.
# Actions are pinned to commit SHAs; the comment names the release.
on:
  push:
    # Other branches run through their pull request, not twice.
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Gorynych.slnx -c Release
      - run: dotnet test --project tests/Gorynych.Tests -c Release --no-build

  build-macos:
    # The service must also build for macOS (AGENTS.md); nothing runs there yet.
    name: Build (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Gorynych.slnx -c Release

  publish-windows:
    # Native AOT builds of the service and of Gorynych.Outside, laid out as docs/external-clients.md
    # describes: the service in the root, the outside server in outside/. On a v* tag the zip is
    # attached to a draft release; a manual run keeps it as a workflow artifact.
    name: Publish win-x64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-macos]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          # Native AOT finds the MSVC linker through vswhere.
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish src/Gorynych.Service -c Release -r win-x64 -p:PublishAot=true -o publish/Gorynych
          dotnet publish src/Gorynych.Outside -c Release -r win-x64 -p:PublishAot=true -o publish/Gorynych/outside
          Get-ChildItem publish/Gorynych -Recurse -Include *.pdb | Remove-Item
          Copy-Item LICENSE, README.md publish/Gorynych/
          Compress-Archive -Path publish/Gorynych/* -DestinationPath gorynych-win-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gorynych-win-x64
          path: gorynych-win-x64.zip
      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }} # through the environment, never pasted into the script
        run: gh release create "$env:TAG" gorynych-win-x64.zip --draft --generate-notes --title "Gorynych $env:TAG"
