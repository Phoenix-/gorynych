name: CI

# GitHub-hosted runners only. The live tests (GORYNYCH_LIVE=1) need logged-in agents and stay skipped.
# Actions are pinned to commit SHAs; the comment names the release.
on:
  push:
    # Other branches run through their pull request, not twice.
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Gorynych.slnx -c Release
      - run: dotnet test --project tests/Gorynych.Tests -c Release --no-build

  build-macos:
    # The service must also build for macOS (AGENTS.md); nothing runs there yet.
    name: Build (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Gorynych.slnx -c Release

  publish-windows:
    # Native AOT builds of the service and of Gorynych.Outside in one Gorynych folder, laid out as
    # docs/getting-started.md describes: the service in it, the outside server in outside\. Each
    # push to main moves the rolling `nightly` prerelease to that commit; a v* tag gets a draft
    # release; a manual run keeps the zip as a workflow artifact.
    name: Publish win-x64
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [test, build-macos]
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    env:
      ASSET: gorynych-windows-x64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: |
          # Native AOT finds the MSVC linker through vswhere.
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish src/Gorynych.Service -c Release -r win-x64 -p:PublishAot=true -o publish/Gorynych
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/Gorynych.Outside -c Release -r win-x64 -p:PublishAot=true -o publish/Gorynych/outside
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem publish/Gorynych -Recurse -Include *.pdb | Remove-Item
          Copy-Item LICENSE publish/Gorynych/
          # The folder itself goes in, so the zip unpacks to Gorynych\.
          Compress-Archive -Path publish/Gorynych -DestinationPath $env:ASSET
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: gorynych-windows-x64
          path: ${{ env.ASSET }}
      - name: Publish the nightly prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA
          # A run that finishes after a newer commit's must not put its older build back.
          $head = gh api "repos/$repo/commits/main" --jq .sha
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($head -ne $sha) { Write-Host "main is at $head now; that commit's run publishes the nightly"; exit 0 }

          $notes = Join-Path $env:RUNNER_TEMP 'nightly-notes.md'
          [IO.File]::WriteAllLines($notes, @(
            "Gorynych for Windows x64 (Native AOT, unsigned), built from $sha on main.",
            "",
            "Unzip ``$env:ASSET`` into ``%LOCALAPPDATA%\Programs``, which gives ``%LOCALAPPDATA%\Programs\Gorynych``, and follow",
            "$env:GITHUB_SERVER_URL/$repo/blob/main/docs/getting-started.md",
            "",
            "Build log: $env:GITHUB_SERVER_URL/$repo/actions/runs/$env:GITHUB_RUN_ID"
          ))

          # Point the nightly tag at this commit.
          gh api -X PATCH "repos/$repo/git/refs/tags/nightly" -f "sha=$sha" -F force=true --silent
          if ($LASTEXITCODE) {
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/tags/nightly -f "sha=$sha" --silent
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          gh release view nightly --repo $repo --json tagName | Out-Null
          if ($LASTEXITCODE) {
            gh release create nightly --repo $repo --prerelease --title "Nightly" --notes-file $notes --verify-tag
          } else {
            gh release edit nightly --repo $repo --prerelease --title "Nightly" --notes-file $notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload nightly $env:ASSET --repo $repo --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }} # through the environment, never pasted into the script
        run: gh release create "$env:TAG" $env:ASSET --draft --generate-notes --title "Gorynych $env:TAG" --repo $env:GITHUB_REPOSITORY
